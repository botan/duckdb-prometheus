#
# This workflow calls the main distribution pipeline from DuckDB to build, test and (optionally) release the extension
#
name: Main Extension Distribution Pipeline
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.head_ref || '' }}-${{ github.base_ref || '' }}-${{ github.ref != 'refs/heads/main' || github.sha }}
  cancel-in-progress: true

jobs:
  rust-quality:
    name: Rust quality
    runs-on: ubuntu-latest
    steps:
      - name: Check out the extension and CI tools
        uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install stable Rust quality tools
        run: rustup toolchain install stable --profile minimal --component clippy,rustfmt --no-self-update
      - name: Check formatting, lints, and unit tests
        run: rustup run stable make check
      - name: Install minimum supported Rust toolchain
        run: rustup toolchain install 1.86.0 --profile minimal --no-self-update
      - name: Check minimum supported Rust version
        env:
          DUCKDB_EXTENSION_NAME: prometheus
          DUCKDB_EXTENSION_MIN_DUCKDB_VERSION: v1.5.6
        run: rustup run 1.86.0 cargo check --locked --all-targets --all-features

  duckdb-stable-build:
    name: Build extension binaries
    uses: duckdb/extension-ci-tools/.github/workflows/_extension_distribution.yml@v1.5.6
    with:
      duckdb_version: v1.5.6
      ci_tools_version: v1.5.6
      extension_name: prometheus
      extra_toolchains: rust;python3
      exclude_archs: 'linux_amd64_musl;wasm_mvp;wasm_eh;wasm_threads'
