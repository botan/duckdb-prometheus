[package]
name = "prometheus"
version = "0.1.0"
edition = "2024"
rust-version = "1.86"
license = "Apache-2.0"
description = "Query Prometheus-compatible APIs, including Thanos, from DuckDB"
readme = "README.md"
keywords = ["duckdb", "prometheus", "thanos", "analytics"]
categories = ["database"]
publish = false

[lib]
crate-type = ["cdylib"]

[profile.release]
lto = true
strip = true

[dependencies]
chrono = { version = "0.4.45", default-features = false, features = ["std"] }
duckdb = { version = "~1.10506.0", features = ["loadable-extension"] }
reqwest = { version = "0.12.28", default-features = false, features = ["blocking", "rustls-tls"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
thiserror = "2.0.18"
url = "2.5.8"

[lints.rust]
ambiguous_negative_literals = "warn"
missing_debug_implementations = "warn"
redundant_imports = "warn"
redundant_lifetimes = "warn"
trivial_numeric_casts = "warn"
unsafe_op_in_unsafe_fn = "deny"
unused_lifetimes = "warn"

[lints.clippy]
cargo = { level = "allow", priority = -1 }
complexity = { level = "warn", priority = -1 }
correctness = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
perf = { level = "warn", priority = -1 }
style = { level = "warn", priority = -1 }
suspicious = { level = "warn", priority = -1 }

# Low-noise restriction lints recommended by the Pragmatic Rust Guidelines.
allow_attributes_without_reason = "warn"
as_pointer_underscore = "warn"
assertions_on_result_states = "warn"
clone_on_ref_ptr = "warn"
deref_by_slicing = "warn"
disallowed_script_idents = "warn"
empty_drop = "warn"
empty_enum_variants_with_brackets = "warn"
empty_structs_with_brackets = "warn"
fn_to_numeric_cast_any = "warn"
if_then_some_else_none = "warn"
redundant_type_annotations = "warn"
renamed_function_params = "warn"
semicolon_outside_block = "warn"
undocumented_unsafe_blocks = "warn"
unnecessary_safety_comment = "warn"
unnecessary_safety_doc = "warn"
unneeded_field_pattern = "warn"
unused_result_ok = "warn"

# Structured log message templates intentionally contain formatting braces.
literal_string_with_formatting_args = "allow"
# The entrypoint macro emits a public Result-returning C wrapper without docs.
missing_errors_doc = "allow"
